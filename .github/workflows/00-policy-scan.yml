name: 每日政策扫描与宏观解读

on:
  # 【定时·北京时间】每天 18:00（UTC 10:00），包含周末，不做交易日限制
  schedule:
    - cron: '0 10 * * *'
  # 允许手动触发
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行（跳过任何前置检查）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write   # 用于将生成的报告提交回仓库 policy_digest/

# 并发控制：避免定时积压时同一工作流并发运行、重复推送
concurrency:
  group: policy-scan
  cancel-in-progress: false

jobs:
  policy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行政策扫描与宏观解读
        env:
          # 优先使用 DeepSeek 最新模型 deepseek-flash（官方 Search API 实时联网检索）
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING || 'disabled' }}
          # 智谱 GLM-4-Flash 二级兜底（免费 + 实时联网检索）
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: ${{ vars.ZHIPU_MODEL || 'glm-4-flash' }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          # Gemini 兜底配置
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          POLICY_FORCE: ${{ github.event.inputs.force_run }}
        run: python policy_scan.py

      - name: 上传报告产物（失败也可查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-digest-${{ github.run_id }}
          path: policy_digest/
          if-no-files-found: ignore
