name: 每日全球事件与资金流向扫描

on:
  # 【触发方式变更】GitHub Actions 免费版 schedule 连续多天延迟 6~8 小时并漏触发，已弃用仓库内置 cron。
  # 改由 WorkBuddy 本机定时自动化按北京时间调用 workflow_dispatch 精确触发，
  # 自动化内含「今天已成功推送则跳过」的幂等检查，避免重复推送微信。
  # 北京时间交易日 09:00；下方「交易日检查」对手动触发同样生效（可勾 force 跳过）。
  workflow_dispatch:
    inputs:
      force:
        description: '强制运行（跳过交易日检查，仅用于手动测试）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 用于将生成的报告提交回仓库 global_scan/

# 并发控制：避免定时积压时同一工作流并发运行、重复推送
concurrency:
  group: global-scan
  cancel-in-progress: false

jobs:
  global-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 交易日检查（跳过周末与法定节假日）
        id: trading_day
        if: github.event.inputs.force != 'true'
        shell: bash
        run: |
          python -m pip install -q chinese-calendar
          python - <<'PY'
          import datetime, os

          # 用 UTC+8 计算「北京时间今天」，不依赖系统时区数据库
          today = (datetime.datetime.now(datetime.timezone.utc)
                   + datetime.timedelta(hours=8)).date()
          try:
              from chinese_calendar import is_workday
              # A 股周末不开市（含调休上班的周末），且排除法定节假日
              ok = today.weekday() < 5 and is_workday(today)
              reason = "交易日" if ok else "非交易日（周末/法定节假日）"
          except Exception as e:
              # 日历数据尚未覆盖（如跨年未更新）时 fail-open，避免漏推
              ok = True
              reason = f"日历不可用，fail-open: {e}"
          print(f"[global_scan] {today} -> {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"is_trading_day={'true' if ok else 'false'}\n")
          PY

      - name: 执行全球重大事件与资金流向深度扫描
        if: github.event.inputs.force == 'true' || steps.trading_day.outputs.is_trading_day == 'true'
        env:
          # 优先使用 DeepSeek 最新模型 deepseek-flash（官方 Search API 实时联网检索）
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING || 'disabled' }}
          # 智谱 GLM-4-Flash 二级兜底（免费 + 实时联网检索）
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: ${{ vars.ZHIPU_MODEL || 'glm-4-flash' }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          # Gemini 兜底配置
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          # GitHub Models（免费 GPT-4o，负责深度综合分析）；secret 名不能用 GITHUB_ 前缀，故用 GH_MODELS_TOKEN
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_MODELS_MODEL: ${{ vars.GH_MODELS_MODEL || 'openai/gpt-4o' }}
        run: python global_scan.py

      - name: 上传报告产物（失败也可查）
        if: always() && (github.event.inputs.force == 'true' || steps.trading_day.outputs.is_trading_day == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: global-scan-${{ github.run_id }}
          path: global_scan/
          if-no-files-found: ignore
